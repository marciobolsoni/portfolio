<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="CodePipeline to S3 static deploy architecture diagram">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
    <marker id="arrow4p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
    <marker id="arrow4r" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dd344c"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg4)"/>

  <text x="600" y="38" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">CODEPIPELINE → S3 STATIC DEPLOY · END-TO-END &lt; 90s</text>

  <!-- Engineer -->
  <g transform="translate(40, 240)">
    <rect width="120" height="64" rx="10" fill="#0d1428" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="60" y="28" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">ENGINEER</text>
    <text x="60" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">git push</text>
  </g>

  <!-- GitHub -->
  <g transform="translate(200, 240)">
    <rect width="140" height="64" rx="10" fill="#0a1424" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="70" y="28" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">SCM</text>
    <text x="70" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">GitHub · main</text>
  </g>

  <!-- CodePipeline -->
  <g transform="translate(380, 240)">
    <rect width="160" height="64" rx="10" fill="#1f1428" stroke="#c925d1" stroke-width="1.5"/>
    <text x="80" y="28" fill="#c925d1" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">ORCHESTRATOR</text>
    <text x="80" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">CodePipeline</text>
  </g>

  <!-- CodeBuild -->
  <g transform="translate(580, 110)">
    <rect width="180" height="80" rx="10" fill="#1f1428" stroke="#c925d1" stroke-width="1.5"/>
    <text x="90" y="28" fill="#c925d1" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">BUILD STAGE</text>
    <text x="90" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">CodeBuild</text>
    <text x="90" y="68" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">buildspec.yml · npm build</text>
  </g>

  <!-- Artifact bucket -->
  <g transform="translate(580, 240)">
    <rect width="180" height="64" rx="10" fill="#162a1c" stroke="#86efac" stroke-width="1.5"/>
    <text x="90" y="28" fill="#86efac" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">ARTIFACT BUCKET</text>
    <text x="90" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">S3 (versioned)</text>
  </g>

  <!-- Deploy Stage -->
  <g transform="translate(580, 360)">
    <rect width="180" height="80" rx="10" fill="#1f3127" stroke="#86efac" stroke-width="2"/>
    <text x="90" y="28" fill="#86efac" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">DEPLOY STAGE</text>
    <text x="90" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">aws s3 sync</text>
    <text x="90" y="68" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">+ CF invalidate</text>
  </g>

  <!-- S3 site bucket -->
  <g transform="translate(820, 240)">
    <rect width="160" height="64" rx="10" fill="#162a1c" stroke="#86efac" stroke-width="1.5"/>
    <text x="80" y="28" fill="#86efac" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">SITE BUCKET</text>
    <text x="80" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">S3</text>
  </g>

  <!-- CloudFront -->
  <g transform="translate(1020, 240)">
    <rect width="140" height="64" rx="10" fill="#1e1b3a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="70" y="28" fill="#a78bfa" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">EDGE</text>
    <text x="70" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">CloudFront</text>
  </g>

  <!-- Player -->
  <g transform="translate(1020, 350)">
    <rect width="140" height="64" rx="10" fill="#0d1428" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="70" y="28" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">PLAYER</text>
    <text x="70" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Browser</text>
  </g>

  <!-- IAM -->
  <g transform="translate(380, 460)">
    <rect width="160" height="60" rx="10" fill="#2a1a1f" stroke="#dd344c" stroke-width="1.5"/>
    <text x="80" y="26" fill="#dd344c" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">LEAST-PRIV IAM</text>
    <text x="80" y="46" fill="#e6edf3" font-family="Inter,sans-serif" font-size="12" font-weight="600" text-anchor="middle">role per stage</text>
  </g>

  <!-- CloudTrail -->
  <g transform="translate(580, 480)">
    <rect width="180" height="50" rx="10" fill="#2a1428" stroke="#e7157b" stroke-width="1.5"/>
    <text x="90" y="22" fill="#e7157b" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">AUDIT</text>
    <text x="90" y="40" fill="#e6edf3" font-family="Inter,sans-serif" font-size="12" font-weight="600" text-anchor="middle">CloudTrail</text>
  </g>

  <!-- Connections -->
  <g fill="none" stroke="#7dd3fc" stroke-width="2">
    <path d="M160 272 L200 272" marker-end="url(#arrow4)" stroke="#7dd3fc"/>
    <path d="M340 272 L380 272" marker-end="url(#arrow4)" stroke="#86efac"/>
    <path d="M540 268 L580 178" marker-end="url(#arrow4)" stroke="#86efac"/>
    <path d="M670 190 L670 240" marker-end="url(#arrow4p)" stroke="#a78bfa"/>
    <path d="M670 304 L670 360" marker-end="url(#arrow4)" stroke="#86efac"/>
    <path d="M760 400 L900 304" marker-end="url(#arrow4)" stroke="#86efac"/>
    <path d="M820 272 L1020 272" marker-end="url(#arrow4p)" stroke="#a78bfa"/>
    <path d="M1090 304 L1090 350" marker-end="url(#arrow4)" stroke="#7dd3fc"/>
    <path d="M460 460 L460 304" marker-end="url(#arrow4r)" stroke="#dd344c" stroke-dasharray="3 2"/>
    <path d="M540 304 L580 484" marker-end="url(#arrow4)" stroke="#94a3b8" stroke-dasharray="3 2" opacity="0.7"/>
  </g>

  <g font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">
    <text x="170" y="262">push</text>
    <text x="350" y="262">webhook</text>
    <text x="540" y="220">source</text>
    <text x="680" y="222">artifact</text>
    <text x="690" y="338">sync</text>
    <text x="900" y="270">origin</text>
    <text x="1090" y="332">CDN</text>
    <text x="475" y="358" fill="#dd344c">role per stage</text>
    <text x="540" y="375">audit trail</text>
  </g>

  <!-- Footer -->
  <g transform="translate(40, 568)" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">
    <text x="0" y="9">marciobolsoni/codepipeline-s3-game · push-to-deploy &lt; 90s · all actions logged to CloudTrail · zero shared deploy creds</text>
  </g>
</svg>
