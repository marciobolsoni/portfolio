<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Kube-news on Kubernetes architecture diagram">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
    <marker id="arrow3p" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg3)"/>

  <text x="600" y="38" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">KUBE-NEWS — KUBERNETES DEPLOYMENT</text>

  <g transform="translate(40, 260)">
    <rect width="120" height="64" rx="10" fill="#0d1428" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="60" y="28" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">USER</text>
    <text x="60" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Browser</text>
  </g>

  <g transform="translate(200, 260)">
    <rect width="140" height="64" rx="10" fill="#1e1b3a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="70" y="28" fill="#a78bfa" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">DNS · TLS</text>
    <text x="70" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Route 53 + ACM</text>
  </g>

  <g transform="translate(380, 80)">
    <rect width="780" height="490" rx="14" fill="#0d1428" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="20" y="28" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="11" letter-spacing="2">KUBERNETES CLUSTER</text>
    <g transform="translate(40, 200)">
      <rect width="180" height="64" rx="10" fill="#1e1b3a" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="90" y="28" fill="#a78bfa" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">INGRESS</text>
      <text x="90" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">TLS termination</text>
    </g>
    <g transform="translate(260, 200)">
      <rect width="180" height="64" rx="10" fill="#162a1c" stroke="#86efac" stroke-width="1.5"/>
      <text x="90" y="28" fill="#86efac" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">SERVICE · ClusterIP</text>
      <text x="90" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">kube-news-svc</text>
    </g>
    <g transform="translate(480, 100)">
      <rect width="270" height="280" rx="12" fill="#0a1f10" stroke="#86efac" stroke-width="1.5" stroke-dasharray="5 3"/>
      <text x="135" y="22" fill="#86efac" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">DEPLOYMENT (3 replicas)</text>
      <text x="135" y="38" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">rolling · maxUnavailable: 1</text>
      <g transform="translate(20, 56)">
        <rect width="100" height="60" rx="8" fill="#162a1c" stroke="#86efac" stroke-width="1"/>
        <text x="50" y="22" fill="#86efac" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">POD</text>
        <text x="50" y="40" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600" text-anchor="middle">node:18</text>
        <text x="50" y="54" fill="#94a3b8" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">app + sidecar</text>
      </g>
      <g transform="translate(140, 56)">
        <rect width="100" height="60" rx="8" fill="#162a1c" stroke="#86efac" stroke-width="1"/>
        <text x="50" y="22" fill="#86efac" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">POD</text>
        <text x="50" y="40" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600" text-anchor="middle">node:18</text>
        <text x="50" y="54" fill="#94a3b8" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">app + sidecar</text>
      </g>
      <g transform="translate(80, 130)">
        <rect width="100" height="60" rx="8" fill="#162a1c" stroke="#86efac" stroke-width="1"/>
        <text x="50" y="22" fill="#86efac" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">POD</text>
        <text x="50" y="40" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600" text-anchor="middle">node:18</text>
        <text x="50" y="54" fill="#94a3b8" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">app + sidecar</text>
      </g>
      <g transform="translate(20, 210)">
        <rect width="220" height="50" rx="8" fill="#0d1428" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 2"/>
        <text x="110" y="20" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">PROBES → /health</text>
        <text x="110" y="38" fill="#94a3b8" font-family="Inter,sans-serif" font-size="9" text-anchor="middle">liveness · readiness · startupDelay</text>
      </g>
    </g>
    <g transform="translate(260, 380)">
      <rect width="200" height="80" rx="10" fill="#1f1428" stroke="#c925d1" stroke-width="1.5"/>
      <text x="100" y="28" fill="#c925d1" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">STATEFULSET</text>
      <text x="100" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">PostgreSQL</text>
      <text x="100" y="68" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">single primary</text>
    </g>
    <g transform="translate(490, 400)">
      <rect width="180" height="60" rx="10" fill="#0d1428" stroke="#a78bfa" stroke-width="1.5"/>
      <text x="90" y="26" fill="#a78bfa" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">PVC</text>
      <text x="90" y="46" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">data dir (10 GiB)</text>
    </g>
    <g transform="translate(40, 380)">
      <rect width="180" height="40" rx="8" fill="#0a1424" stroke="#7dd3fc" stroke-width="1" stroke-dasharray="4 2"/>
      <text x="90" y="18" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">CONFIGMAP</text>
      <text x="90" y="32" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">env (non-secret)</text>
    </g>
    <g transform="translate(40, 430)">
      <rect width="180" height="40" rx="8" fill="#2a1a1f" stroke="#dd344c" stroke-width="1" stroke-dasharray="4 2"/>
      <text x="90" y="18" fill="#dd344c" font-family="Inter,sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">SECRET</text>
      <text x="90" y="32" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">DB credentials</text>
    </g>
  </g>

  <g fill="none" stroke="#7dd3fc" stroke-width="2">
    <path d="M160 292 L200 292" marker-end="url(#arrow3)" stroke="#7dd3fc"/>
    <path d="M340 292 L420 232" marker-end="url(#arrow3)" stroke="#7dd3fc"/>
    <path d="M600 232 L740 232" marker-end="url(#arrow3)" stroke="#86efac"/>
    <path d="M820 232 L860 232" marker-end="url(#arrow3)" stroke="#86efac"/>
    <path d="M740 380 L640 410" marker-end="url(#arrow3p)" stroke="#a78bfa"/>
    <path d="M660 460 L870 460" marker-end="url(#arrow3p)" stroke="#a78bfa"/>
    <path d="M600 400 L820 296" marker-end="url(#arrow3)" stroke="#7dd3fc" stroke-dasharray="3 2" opacity="0.6"/>
    <path d="M600 450 L820 380" marker-end="url(#arrow3)" stroke="#dd344c" stroke-dasharray="3 2" opacity="0.7"/>
  </g>

  <g font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">
    <text x="170" y="284">HTTPS</text>
    <text x="380" y="220">443</text>
    <text x="650" y="220">round-robin</text>
    <text x="700" y="450">storage</text>
    <text x="855" y="290" fill="#7dd3fc">env injection</text>
    <text x="855" y="370" fill="#dd344c">auth secrets</text>
  </g>

  <g transform="translate(40, 568)" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">
    <text x="0" y="9">marciobolsoni/kube-news · multi-stage Dockerfile (~80MB) · zero-downtime rolling deploys · probes drive readiness gating</text>
  </g>
</svg>
