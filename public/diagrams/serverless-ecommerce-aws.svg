<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-label="Serverless E-commerce on AWS architecture">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="ar3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dd344c"/>
    </marker>
    <symbol id="ico-route53" viewBox="0 0 60 60">
      <rect width="60" height="60" rx="6" fill="#8C4FFF"/>
      <text x="30" y="38" text-anchor="middle" fill="#fff" font-family="Inter,sans-serif" font-size="20" font-weight="700">53</text>
    </symbol>
    <symbol id="ico-cloudfront" viewBox="0 0 60 60">
      <rect width="60" height="60" rx="6" fill="#8C4FFF"/>
      <circle cx="30" cy="30" r="14" fill="none" stroke="#fff" stroke-width="2.2"/>
      <path d="M16 30 H44 M30 16 V44 M19 19 L41 41 M41 19 L19 41" stroke="#fff" stroke-width="1.4" fill="none" opacity="0.85"/>
    </symbol>
    <symbol id="ico-apigw" viewBox="0 0 60 60">
      <rect width="60" height="60" rx="6" fill="#8C4FFF"/>
      <path d="M14 30 L30 18 L46 30 L30 42 Z" fill="none" stroke="#fff" stroke-width="2.2"/>
      <circle cx="30" cy="30" r="3" fill="#fff"/>
    </symbol>
    <symbol id="ico-s3" viewBox="0 0 60 60">
      <rect width="60" height="60" rx="6" fill="#7AA116"/>
      <ellipse cx="30" cy="20" rx="14" ry="4" fill="none" stroke="#fff" stroke-width="2"/>
      <path d="M16 20 V40 a14 4 0 0 0 28 0 V20" fill="none" stroke="#fff" stroke-width="2"/>
    </symbol>
    <symbol id="ico-lambda" viewBox="0 0 60 60">
      <rect width="60" height="60" rx="6" fill="#ED7100"/>
      <path d="M16 16 L24 16 L42 44 L34 44 L28 34 L22 44 L14 44 Z" fill="#fff"/>
    </symbol>
    <symbol id="ico-dynamodb" viewBox="0 0 60 60">
      <rect width="60" height="60" rx="6" fill="#C925D1"/>
      <ellipse cx="30" cy="18" rx="16" ry="4" fill="none" stroke="#fff" stroke-width="2"/>
      <ellipse cx="30" cy="30" rx="16" ry="4" fill="none" stroke="#fff" stroke-width="2"/>
      <ellipse cx="30" cy="42" rx="16" ry="4" fill="none" stroke="#fff" stroke-width="2"/>
      <line x1="14" y1="18" x2="14" y2="42" stroke="#fff" stroke-width="2"/>
      <line x1="46" y1="18" x2="46" y2="42" stroke="#fff" stroke-width="2"/>
    </symbol>
    <symbol id="ico-cognito" viewBox="0 0 60 60">
      <rect width="60" height="60" rx="6" fill="#DD344C"/>
      <circle cx="30" cy="24" r="7" fill="none" stroke="#fff" stroke-width="2.2"/>
      <path d="M16 46 a14 14 0 0 1 28 0" fill="none" stroke="#fff" stroke-width="2.2"/>
    </symbol>
    <symbol id="ico-iam" viewBox="0 0 60 60">
      <rect width="60" height="60" rx="6" fill="#DD344C"/>
      <path d="M30 14 L44 20 V32 a14 14 0 0 1 -14 14 a14 14 0 0 1 -14 -14 V20 Z" fill="none" stroke="#fff" stroke-width="2.2"/>
      <path d="M22 30 L28 36 L40 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ico-cloudwatch" viewBox="0 0 60 60">
      <rect width="60" height="60" rx="6" fill="#E7157B"/>
      <circle cx="26" cy="26" r="10" fill="none" stroke="#fff" stroke-width="2.2"/>
      <line x1="34" y1="34" x2="44" y2="44" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M20 26 L24 22 L28 30 L32 22" fill="none" stroke="#fff" stroke-width="1.6"/>
    </symbol>
    <symbol id="ico-browser" viewBox="0 0 60 60">
      <rect width="60" height="60" rx="6" fill="#1f2937" stroke="#7dd3fc" stroke-width="2"/>
      <rect x="10" y="14" width="40" height="32" rx="3" fill="none" stroke="#7dd3fc" stroke-width="1.6"/>
      <line x1="10" y1="22" x2="50" y2="22" stroke="#7dd3fc" stroke-width="1.6"/>
      <circle cx="14" cy="18" r="1.2" fill="#7dd3fc"/>
      <circle cx="18" cy="18" r="1.2" fill="#7dd3fc"/>
    </symbol>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <text x="600" y="38" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">SERVERLESS E-COMMERCE — AWS</text>
  <text x="600" y="60" fill="#94a3b8" font-family="Inter,sans-serif" font-size="11" text-anchor="middle">marciobolsoni / serverless-ecommerce-aws · scales to zero · pay-per-request</text>

  <rect x="200" y="100" width="960" height="540" rx="14" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6 4" opacity="0.5"/>
  <text x="216" y="124" fill="#94a3b8" font-family="Inter,sans-serif" font-size="11" letter-spacing="2">AWS CLOUD</text>

  <g transform="translate(40, 280)">
    <use href="#ico-browser" width="60" height="60"/>
    <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">User</text>
    <text x="30" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">Browser · Mobile</text>
  </g>

  <g transform="translate(240, 280)">
    <use href="#ico-route53" width="60" height="60"/>
    <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">Route 53</text>
    <text x="30" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">DNS</text>
  </g>

  <g transform="translate(400, 180)">
    <use href="#ico-cloudfront" width="60" height="60"/>
    <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">CloudFront</text>
    <text x="30" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">Edge cache</text>
  </g>

  <g transform="translate(560, 180)">
    <use href="#ico-s3" width="60" height="60"/>
    <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">S3</text>
    <text x="30" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">SPA hosting</text>
  </g>

  <g transform="translate(400, 380)">
    <use href="#ico-apigw" width="60" height="60"/>
    <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">API Gateway</text>
    <text x="30" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">HTTP API · JWT</text>
  </g>

  <g transform="translate(240, 460)">
    <use href="#ico-cognito" width="60" height="60"/>
    <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">Cognito</text>
    <text x="30" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">User pool</text>
  </g>

  <g transform="translate(580, 320)">
    <rect x="-20" y="-12" width="200" height="220" rx="10" fill="rgba(237,113,0,0.05)" stroke="#ED7100" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="80" y="2" text-anchor="middle" fill="#ED7100" font-family="Inter,sans-serif" font-size="10" letter-spacing="2">LAMBDA FUNCTIONS</text>
    <g transform="translate(50, 16)">
      <use href="#ico-lambda" width="60" height="60"/>
      <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">products-fn</text>
    </g>
    <g transform="translate(50, 102)">
      <use href="#ico-lambda" width="60" height="60"/>
      <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">cart-fn</text>
    </g>
  </g>

  <g transform="translate(760, 410)">
    <use href="#ico-lambda" width="60" height="60"/>
    <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">orders-fn</text>
    <text x="30" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">prov. concurrency</text>
  </g>

  <g transform="translate(960, 380)">
    <use href="#ico-dynamodb" width="60" height="60"/>
    <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">DynamoDB</text>
    <text x="30" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">single-table</text>
  </g>

  <g transform="translate(960, 180)">
    <use href="#ico-cloudwatch" width="60" height="60"/>
    <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">CloudWatch</text>
    <text x="30" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">Logs · X-Ray</text>
  </g>

  <g transform="translate(960, 540)">
    <use href="#ico-iam" width="60" height="60"/>
    <text x="30" y="78" text-anchor="middle" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" font-weight="600">IAM</text>
    <text x="30" y="92" text-anchor="middle" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">least-priv roles</text>
  </g>

  <g fill="none" stroke-width="2">
    <path d="M100 310 L240 310" stroke="#7dd3fc" marker-end="url(#ar2)"/>
    <path d="M300 305 L400 220" stroke="#7dd3fc" marker-end="url(#ar2)"/>
    <path d="M460 210 L560 210" stroke="#86efac" marker-end="url(#ar)"/>
    <path d="M300 320 L400 400" stroke="#86efac" marker-end="url(#ar)"/>
    <path d="M460 410 L580 360" stroke="#86efac" marker-end="url(#ar)"/>
    <path d="M460 410 L580 460" stroke="#86efac" marker-end="url(#ar)"/>
    <path d="M460 410 L760 440" stroke="#86efac" marker-end="url(#ar)"/>
    <path d="M740 360 L960 410" stroke="#86efac" marker-end="url(#ar)"/>
    <path d="M740 460 L960 410" stroke="#86efac" marker-end="url(#ar)"/>
    <path d="M820 440 L960 410" stroke="#86efac" marker-end="url(#ar)"/>
    <path d="M820 410 L960 240" stroke="#94a3b8" marker-end="url(#ar)" stroke-dasharray="3 3" opacity="0.7"/>
    <path d="M300 480 L400 440" stroke="#dd344c" marker-end="url(#ar3)" stroke-dasharray="4 3"/>
  </g>

  <g font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">
    <text x="160" y="302">DNS</text>
    <text x="320" y="260">static</text>
    <text x="480" y="200">origin</text>
    <text x="320" y="385">api.*</text>
    <text x="800" y="395">logs</text>
    <text x="320" y="435" fill="#dd344c">authorize</text>
  </g>

  <g transform="translate(220, 650)" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">
    <circle cx="6" cy="6" r="4" fill="#86efac"/><text x="18" y="9">Data path</text>
    <circle cx="120" cy="6" r="4" fill="#7dd3fc"/><text x="132" y="9">Network/DNS</text>
    <circle cx="240" cy="6" r="4" fill="#dd344c"/><text x="252" y="9">Authorisation (JWT)</text>
    <circle cx="400" cy="6" r="4" fill="#94a3b8"/><text x="412" y="9">Telemetry</text>
  </g>
</svg>
