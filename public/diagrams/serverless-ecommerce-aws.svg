<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Serverless E-commerce on AWS architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.0"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#86efac" stop-opacity="0.9"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
    <marker id="arrowAuth" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dd344c"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <text x="600" y="38" fill="#7dd3fc" font-family="Inter, system-ui, sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">SERVERLESS E-COMMERCE — AWS ARCHITECTURE</text>

  <g transform="translate(40, 240)">
    <rect width="140" height="80" rx="10" fill="#0d1428" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="70" y="38" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Browser</text>
    <text x="70" y="58" fill="#94a3b8" font-family="Inter,sans-serif" font-size="11" text-anchor="middle">Mobile · Web</text>
  </g>

  <g transform="translate(230, 240)">
    <rect width="120" height="80" rx="10" fill="#1e1b3a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="60" y="32" fill="#a78bfa" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">DNS</text>
    <text x="60" y="54" fill="#e6edf3" font-family="Inter,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Route 53</text>
    <text x="60" y="70" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">+ Cert Manager</text>
  </g>

  <g transform="translate(420, 130)">
    <rect width="160" height="80" rx="10" fill="#1e1b3a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="80" y="32" fill="#a78bfa" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">EDGE CACHE</text>
    <text x="80" y="54" fill="#e6edf3" font-family="Inter,sans-serif" font-size="14" font-weight="600" text-anchor="middle">CloudFront</text>
    <text x="80" y="70" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">~90% read offload</text>
  </g>

  <g transform="translate(640, 130)">
    <rect width="140" height="80" rx="10" fill="#162a1c" stroke="#86efac" stroke-width="1.5"/>
    <text x="70" y="32" fill="#86efac" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">STATIC SITE</text>
    <text x="70" y="54" fill="#e6edf3" font-family="Inter,sans-serif" font-size="14" font-weight="600" text-anchor="middle">S3 (SPA)</text>
    <text x="70" y="70" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">React build</text>
  </g>

  <g transform="translate(420, 350)">
    <rect width="160" height="80" rx="10" fill="#1e1b3a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="80" y="32" fill="#a78bfa" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">HTTP API</text>
    <text x="80" y="54" fill="#e6edf3" font-family="Inter,sans-serif" font-size="14" font-weight="600" text-anchor="middle">API Gateway</text>
    <text x="80" y="70" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">JWT authorizer</text>
  </g>

  <g transform="translate(220, 460)">
    <rect width="160" height="70" rx="10" fill="#2a1a1f" stroke="#dd344c" stroke-width="1.5"/>
    <text x="80" y="28" fill="#dd344c" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">AUTH</text>
    <text x="80" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Cognito User Pool</text>
  </g>

  <g transform="translate(640, 290)">
    <rect width="200" height="220" rx="12" fill="#1a1408" stroke="#ed7100" stroke-width="1" stroke-dasharray="4 3" opacity="0.85"/>
    <text x="100" y="22" fill="#ed7100" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">LAMBDA FUNCTIONS</text>
    <g transform="translate(20, 38)">
      <rect width="160" height="42" rx="6" fill="#2a1f0d" stroke="#ed7100" stroke-width="1"/>
      <text x="14" y="20" fill="#ed7100" font-family="ui-monospace, monospace" font-size="11" font-weight="700">λ</text>
      <text x="36" y="18" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600">products-fn</text>
      <text x="36" y="34" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">read · catalog</text>
    </g>
    <g transform="translate(20, 90)">
      <rect width="160" height="42" rx="6" fill="#2a1f0d" stroke="#ed7100" stroke-width="1"/>
      <text x="14" y="20" fill="#ed7100" font-family="ui-monospace, monospace" font-size="11" font-weight="700">λ</text>
      <text x="36" y="18" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600">cart-fn</text>
      <text x="36" y="34" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">read/write · cart</text>
    </g>
    <g transform="translate(20, 142)">
      <rect width="160" height="42" rx="6" fill="#2a1f0d" stroke="#ed7100" stroke-width="1"/>
      <text x="14" y="20" fill="#ed7100" font-family="ui-monospace, monospace" font-size="11" font-weight="700">λ</text>
      <text x="36" y="18" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600">orders-fn</text>
      <text x="36" y="34" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10">provisioned concurrency</text>
    </g>
  </g>

  <g transform="translate(900, 350)">
    <rect width="160" height="100" rx="10" fill="#1f1428" stroke="#c925d1" stroke-width="1.5"/>
    <text x="80" y="32" fill="#c925d1" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">SINGLE-TABLE</text>
    <text x="80" y="54" fill="#e6edf3" font-family="Inter,sans-serif" font-size="14" font-weight="600" text-anchor="middle">DynamoDB</text>
    <text x="80" y="74" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">on-demand · GSIs</text>
  </g>

  <g transform="translate(900, 130)">
    <rect width="160" height="80" rx="10" fill="#2a1428" stroke="#e7157b" stroke-width="1.5"/>
    <text x="80" y="32" fill="#e7157b" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">OBSERVABILITY</text>
    <text x="80" y="54" fill="#e6edf3" font-family="Inter,sans-serif" font-size="14" font-weight="600" text-anchor="middle">CloudWatch</text>
    <text x="80" y="70" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">Logs · Metrics · X-Ray</text>
  </g>

  <g transform="translate(900, 480)">
    <rect width="160" height="60" rx="10" fill="#2a1a1f" stroke="#dd344c" stroke-width="1.5"/>
    <text x="80" y="26" fill="#dd344c" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">LEAST-PRIV</text>
    <text x="80" y="46" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">IAM Roles</text>
  </g>

  <g fill="none" stroke="#7dd3fc" stroke-width="2">
    <path d="M180 280 L230 280" marker-end="url(#arrow)" stroke="#7dd3fc"/>
    <path d="M350 268 L420 178" marker-end="url(#arrow)" stroke="#7dd3fc"/>
    <path d="M350 292 L420 380" marker-end="url(#arrow)" stroke="#a78bfa"/>
    <path d="M580 170 L640 170" marker-end="url(#arrow)" stroke="#86efac"/>
    <path d="M580 380 L640 380" marker-end="url(#arrow)" stroke="#86efac"/>
    <path d="M580 396 L640 432" marker-end="url(#arrow)" stroke="#86efac"/>
    <path d="M580 410 L640 482" marker-end="url(#arrow)" stroke="#86efac"/>
    <path d="M840 380 L900 400" marker-end="url(#arrow)" stroke="#86efac"/>
    <path d="M840 432 L900 410" marker-end="url(#arrow)" stroke="#86efac"/>
    <path d="M840 484 L900 420" marker-end="url(#arrow)" stroke="#86efac"/>
    <path d="M740 290 L900 200" marker-end="url(#arrow)" stroke="#94a3b8" stroke-dasharray="4 3" opacity="0.7"/>
    <path d="M380 460 L500 430" marker-end="url(#arrowAuth)" stroke="#dd344c" stroke-dasharray="4 3"/>
  </g>

  <g font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">
    <text x="195" y="270">DNS</text>
    <text x="380" y="220">static</text>
    <text x="380" y="335">api.*</text>
    <text x="600" y="160">edge</text>
    <text x="850" y="280">logs/traces</text>
    <text x="430" y="455" fill="#dd344c">authorize</text>
  </g>

  <g transform="translate(40, 530)" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">
    <circle cx="6" cy="6" r="4" fill="#86efac"/>
    <text x="18" y="9">Data path</text>
    <circle cx="92" cy="6" r="4" fill="#dd344c"/>
    <text x="104" y="9">Auth (JWT)</text>
    <circle cx="190" cy="6" r="4" fill="#94a3b8"/>
    <text x="202" y="9">Telemetry</text>
  </g>
</svg>
