<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-label="Terraform on AWS — IaC workflow architecture diagram">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1f"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
    <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="strokeWidth" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7dd3fc"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg2)"/>

  <text x="600" y="38" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="13" letter-spacing="3" text-anchor="middle">TERRAFORM ON AWS — IaC + CI/CD WORKFLOW</text>

  <g transform="translate(40, 90)">
    <rect width="140" height="64" rx="10" fill="#0d1428" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="70" y="28" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">ENGINEER</text>
    <text x="70" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">local CLI</text>
  </g>

  <g transform="translate(220, 90)">
    <rect width="140" height="64" rx="10" fill="#0a1424" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="70" y="28" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">SCM</text>
    <text x="70" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">GitHub repo</text>
  </g>

  <g transform="translate(400, 90)">
    <rect width="190" height="64" rx="10" fill="#162a1c" stroke="#86efac" stroke-width="1.5"/>
    <text x="95" y="28" fill="#86efac" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">CI</text>
    <text x="95" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">GitHub Actions</text>
    <text x="95" y="62" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">fmt → tflint → plan</text>
  </g>

  <g transform="translate(640, 88)">
    <polygon points="80,0 160,34 80,68 0,34" fill="#1e1b3a" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="80" y="32" fill="#a78bfa" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">APPROVE</text>
    <text x="80" y="46" fill="#e6edf3" font-family="Inter,sans-serif" font-size="11" text-anchor="middle">manual gate</text>
  </g>

  <g transform="translate(840, 90)">
    <rect width="180" height="64" rx="10" fill="#1f3127" stroke="#86efac" stroke-width="2"/>
    <text x="90" y="28" fill="#86efac" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">APPLY</text>
    <text x="90" y="50" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">terraform apply</text>
    <text x="90" y="62" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">on main only</text>
  </g>

  <g transform="translate(360, 220)">
    <rect width="380" height="80" rx="10" fill="#0d1428" stroke="#7dd3fc" stroke-width="1.5" stroke-dasharray="6 3"/>
    <text x="190" y="22" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="11" letter-spacing="2" text-anchor="middle">REMOTE BACKEND (versioned, encrypted)</text>
    <g transform="translate(20, 30)">
      <rect width="160" height="40" rx="6" fill="#162a1c" stroke="#86efac" stroke-width="1"/>
      <text x="80" y="18" fill="#86efac" font-family="Inter,sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">S3 + KMS</text>
      <text x="80" y="33" fill="#e6edf3" font-family="Inter,sans-serif" font-size="12" font-weight="600" text-anchor="middle">tfstate</text>
    </g>
    <g transform="translate(200, 30)">
      <rect width="160" height="40" rx="6" fill="#1f1428" stroke="#c925d1" stroke-width="1"/>
      <text x="80" y="18" fill="#c925d1" font-family="Inter,sans-serif" font-size="10" letter-spacing="1.5" text-anchor="middle">DYNAMODB</text>
      <text x="80" y="33" fill="#e6edf3" font-family="Inter,sans-serif" font-size="12" font-weight="600" text-anchor="middle">state-lock</text>
    </g>
  </g>

  <g transform="translate(40, 330)">
    <rect width="1120" height="220" rx="12" fill="#0d1428" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="20" y="28" fill="#a78bfa" font-family="Inter,sans-serif" font-size="11" letter-spacing="2">AWS · provisioned by reusable Terraform modules</text>
    <g transform="translate(40, 56)">
      <rect width="180" height="120" rx="8" fill="#0a1424" stroke="#7dd3fc" stroke-width="1"/>
      <text x="90" y="22" fill="#7dd3fc" font-family="Inter,sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">module: network</text>
      <text x="90" y="46" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">VPC</text>
      <text x="90" y="64" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">public + private subnets</text>
      <text x="90" y="80" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">NAT · IGW · SGs</text>
      <text x="90" y="100" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">multi-AZ</text>
    </g>
    <g transform="translate(240, 56)">
      <rect width="180" height="120" rx="8" fill="#1a1408" stroke="#ed7100" stroke-width="1"/>
      <text x="90" y="22" fill="#ed7100" font-family="Inter,sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">module: compute</text>
      <text x="90" y="46" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">ALB → ASG (EC2)</text>
      <text x="90" y="64" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">launch templates</text>
      <text x="90" y="80" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">target groups</text>
      <text x="90" y="100" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">health checks</text>
    </g>
    <g transform="translate(440, 56)">
      <rect width="180" height="120" rx="8" fill="#2a1a1f" stroke="#dd344c" stroke-width="1"/>
      <text x="90" y="22" fill="#dd344c" font-family="Inter,sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">module: iam</text>
      <text x="90" y="46" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">Roles + Policies</text>
      <text x="90" y="64" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">least-privilege</text>
      <text x="90" y="80" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">scoped to ARNs</text>
    </g>
    <g transform="translate(640, 56)">
      <rect width="180" height="120" rx="8" fill="#1f1428" stroke="#c925d1" stroke-width="1"/>
      <text x="90" y="22" fill="#c925d1" font-family="Inter,sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">module: db</text>
      <text x="90" y="46" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">RDS</text>
      <text x="90" y="64" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">multi-AZ</text>
      <text x="90" y="80" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">backups · KMS at rest</text>
    </g>
    <g transform="translate(840, 56)">
      <rect width="240" height="120" rx="8" fill="#2a1428" stroke="#e7157b" stroke-width="1"/>
      <text x="120" y="22" fill="#e7157b" font-family="Inter,sans-serif" font-size="10" letter-spacing="2" text-anchor="middle">module: observability</text>
      <text x="120" y="46" fill="#e6edf3" font-family="Inter,sans-serif" font-size="13" font-weight="600" text-anchor="middle">CloudWatch</text>
      <text x="120" y="64" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">log groups · alarms</text>
      <text x="120" y="80" fill="#94a3b8" font-family="Inter,sans-serif" font-size="10" text-anchor="middle">SNS topic for paging</text>
    </g>
    <text x="560" y="200" fill="#94a3b8" font-family="Inter,sans-serif" font-size="11" text-anchor="middle">Workspaces: dev · staging · prod — same modules, different vars</text>
  </g>

  <g fill="none" stroke="#7dd3fc" stroke-width="2">
    <path d="M180 122 L220 122" marker-end="url(#arrowS)"/>
    <path d="M360 122 L400 122" marker-end="url(#arrow2)" stroke="#86efac"/>
    <path d="M590 122 L640 122" marker-end="url(#arrow2)" stroke="#a78bfa"/>
    <path d="M800 122 L840 122" marker-end="url(#arrow2)" stroke="#86efac"/>
    <path d="M930 154 L600 220" marker-end="url(#arrowS)" stroke="#7dd3fc" stroke-dasharray="5 3" opacity="0.85"/>
    <path d="M550 300 L400 330" marker-end="url(#arrow2)" stroke="#86efac" stroke-dasharray="5 3" opacity="0.85"/>
  </g>

  <g font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">
    <text x="186" y="116">PR</text>
    <text x="370" y="116">push</text>
    <text x="600" y="116">yes</text>
    <text x="810" y="116">main</text>
    <text x="760" y="190" fill="#7dd3fc">read/write state · acquire lock</text>
    <text x="445" y="320" fill="#86efac">terraform apply provisions</text>
  </g>

  <g transform="translate(40, 568)" font-family="Inter,sans-serif" font-size="10" fill="#94a3b8">
    <text x="0" y="9">marciobolsoni/Terraform-on-AWS · HCL 97% · S3 + DynamoDB backend · GitHub Actions plan-on-PR</text>
  </g>
</svg>
